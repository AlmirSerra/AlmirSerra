<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-labelledby="title desc">
<title id="title">Do negócio à operação</title>
<desc id="desc">Negócio, engenharia e operação conectados por um fluxo contínuo.</desc>
<defs>
<linearGradient id="edge"><stop stop-color="#46e3ee"/><stop offset=".5" stop-color="#a88bff"/><stop offset="1" stop-color="#46e3ee"/></linearGradient>
<filter id="glow" x="-50%" y="-180%" width="200%" height="460%"><feGaussianBlur stdDeviation="3"/></filter>
<path id="tunnel" d="M0 117 C18 117 18 99 36.5 117 S55 135 73 117"/>
</defs>
<rect width="960" height="210" rx="16" fill="#0b1220"/>
<g fill="none" stroke="#203349"><path d="M0 42H960M0 84H960M0 126H960M0 168H960"/><path d="M80 0V210M160 0V210M240 0V210M320 0V210M400 0V210M480 0V210M560 0V210M640 0V210M720 0V210M800 0V210M880 0V210"/></g>
<g fill="none" stroke="url(#edge)" stroke-linecap="round">
<g transform="translate(282 0)">
<use href="#tunnel" stroke-width="14" opacity=".35" filter="url(#glow)"/>
<use href="#tunnel" stroke-width="8" opacity=".15"/>
<use href="#tunnel" transform="translate(0 -4)" stroke-width="1" opacity=".65"/>
<use href="#tunnel" transform="translate(0 4)" stroke-width="1" opacity=".65"/>
<use href="#tunnel" stroke-width="2.5"/>
<use href="#tunnel" stroke="#e5ffff" stroke-width="2" stroke-dasharray="14 85"><animate attributeName="stroke-dashoffset" from="99" to="0" dur="1.8s" repeatCount="indefinite"/></use>
</g>
<g transform="translate(605 0)">
<use href="#tunnel" stroke-width="14" opacity=".35" filter="url(#glow)"/>
<use href="#tunnel" stroke-width="8" opacity=".15"/>
<use href="#tunnel" transform="translate(0 -4)" stroke-width="1" opacity=".65"/>
<use href="#tunnel" transform="translate(0 4)" stroke-width="1" opacity=".65"/>
<use href="#tunnel" stroke-width="2.5"/>
<use href="#tunnel" stroke="#e5ffff" stroke-width="2" stroke-dasharray="14 85"><animate attributeName="stroke-dashoffset" from="99" to="0" dur="1.8s" begin="-.9s" repeatCount="indefinite"/></use>
</g>
</g>
<g fill="#101e30" stroke="#35506a"><rect x="32" y="56" width="250" height="115" rx="10"/><rect x="355" y="56" width="250" height="115" rx="10"/><rect x="678" y="56" width="250" height="115" rx="10"/></g>
<g font-family="Arial,sans-serif"><g font-family="monospace" font-size="11" letter-spacing="2" fill="#63deed"><text x="52" y="81">01 / CONTEXTO</text><text x="375" y="81">02 / CONSTRUÇÃO</text><text x="698" y="81">03 / EVOLUÇÃO</text></g><g fill="#f2f7ff" font-size="23" font-weight="700"><text x="52" y="115">Negócio</text><text x="375" y="115">Engenharia</text><text x="698" y="115">Operação</text></g><g fill="#aebdd3" font-size="13"><text x="52" y="143">Demandas · pessoas · processos</text><text x="375" y="143">Arquitetura · APIs · IA</text><text x="698" y="143">Segurança · observabilidade</text></g></g>
<text x="480" y="194" text-anchor="middle" fill="#839bb7" font-family="monospace" font-size="10" letter-spacing="2">CONTEXTO → DECISÃO → ENTREGA → APRENDIZADO</text>
